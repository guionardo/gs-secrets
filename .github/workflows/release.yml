name: Release

# Creates a versioned GitHub release whenever a semantic version tag
# (v1.2.3, or a prerelease like v1.2.3-rc.1) is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# GoReleaser builds, archives and verifies the binaries, generates the
# checksums file and the release notes, and publishes everything to GitHub
# Releases. Prerelease tags (containing a dash) are published as
# prereleases. See .goreleaser.yml for the build matrix.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Test (race detector)
        run: go test -race ./...

  goreleaser:
    name: Release ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0 # full history so GoReleaser can build the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish npm package
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @guionardo/gs-secrets
        working-directory: npm
        run: |
          cp ../LICENSE LICENSE
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}