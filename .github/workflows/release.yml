name: Release

# Creates a versioned GitHub release whenever a semantic version tag
# (v1.2.3, or a prerelease like v1.2.3-rc.1) is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# GoReleaser builds, archives and verifies the binaries, generates the
# checksums file and the release notes, and publishes everything to GitHub
# Releases. Prerelease tags (containing a dash) are published as
# prereleases. See .goreleaser.yml for the build matrix.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Test (race detector)
        run: go test -race ./...

  goreleaser:
    name: Release ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0 # full history so GoReleaser can build the changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}