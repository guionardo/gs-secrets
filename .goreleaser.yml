# GoReleaser configuration (v2)
# Docs: https://goreleaser.com/customization/
#
# Local dry run:  goreleaser release --snapshot --clean
# Full release:   goreleaser release --clean   (or push a v* tag)

version: 2

project_name: gs-secrets

before:
  hooks:
    - go mod tidy

builds:
  - id: gs-secrets
    main: ./cmd/gs-secrets
    binary: gs-secrets
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/guionardo/gs-secrets/internal/app.version={{ .Version }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  prerelease: auto
  header: |
    ## What's Changed

    Release artifacts: binaries for linux, darwin (macOS) and windows on
    amd64 and arm64, plus `checksums.txt` for verification.

    Install on macOS: `brew install guionardo/tap/gs-secrets`
    Install on Windows: `irm https://raw.githubusercontent.com/guionardo/gs-secrets/main/install.ps1 | iex`
  footer: |
    Generated by [GoReleaser](https://goreleaser.com).

# Publishes a Homebrew cask to the guionardo/homebrew-tap repository.
# Requires the HOMEBREW_TAP_TOKEN secret (a PAT with contents:write on the
# tap repo) — the default GITHUB_TOKEN cannot write to another repository.
# Prerelease tags are not pushed to the tap (skip_upload: auto).
homebrew_casks:
  - name: gs-secrets
    binaries:
      - gs-secrets
    homepage: https://github.com/guionardo/gs-secrets
    description: "Poor-man's secret vault: encrypted, file-based storage for API keys and passwords."
    license: MIT
    skip_upload: auto
    caveats: |
      The binary is not code-signed or notarized. If macOS reports it as
      damaged, remove the quarantine attribute manually:
        xattr -dr com.apple.quarantine $(which gs-secrets)
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gs-secrets"]
          end
    repository:
      owner: guionardo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"