# GoReleaser configuration (v2)
# Docs: https://goreleaser.com/customization/
#
# Local dry run:  goreleaser release --snapshot --clean
# Full release:   goreleaser release --clean   (or push a v* tag)

version: 2

project_name: gs-secrets

before:
  hooks:
    - go mod tidy

builds:
  - id: gs-secrets
    main: ./cmd/gs-secrets
    binary: gs-secrets
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/guionardo/gs-secrets/internal/app.version={{ .Version }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Binary-only archives: installers (install.ps1, npm shim) extract the
    # executable into a cache directory, so no extra files. GoReleaser adds
    # README/LICENSE when the file list is empty, so use a non-matching glob
    # (documented workaround).
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  prerelease: auto
  header: |
    ## What's Changed

    Release artifacts: binaries for linux, darwin (macOS) and windows on
    amd64 and arm64, plus `checksums.txt` for verification.

    Install on Windows: `irm https://raw.githubusercontent.com/guionardo/gs-secrets/main/install.ps1 | iex`
  footer: |
    Generated by [GoReleaser](https://goreleaser.com).